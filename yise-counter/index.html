<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>异色计数器 · 洛克王国世界</title><meta name="description" content="记录刷取精灵、球库存和三个池的80次保底进度。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23172235'/%3E%3Cpath d='m16 4 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z' fill='%23b7f568'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="eyebrow">ROCO KINGDOM WORLD</span><h1>异色计数器 <span>✦</span></h1></div><div class="save" id="save">本机自动保存</div></header><section class="setup panel"><div class="section-title"><h2>这次，追逐哪一只？</h2><span class="small">刷取计划</span></div><div class="fields"><label>正在刷的精灵 1<input id="pet1" placeholder="输入精灵名称" maxlength="40"></label><label>正在刷的精灵 2 <span class="muted">· 可不填</span><input id="pet2" placeholder="同时刷第二只时填写" maxlength="40"></label><label>目标精灵<input id="target" placeholder="你想遇见的异色精灵" maxlength="40"></label></div></section><div class="workspace"><section class="pools-section"><div class="section-title"><h2>保底进度</h2><span class="small">三个池独立计数 · 每池 80 次</span></div><div class="pool-body"><div id="pools"></div><div class="pool-notes"><button id="undo" class="text-button">撤销上一步</button><p class="hint">计数与球数独立，不会自动扣球；保底基准为80次，超过80次仍可继续记录。出异色或开始下一轮时，手动重置对应池。</p></div></div></section><aside><div class="section-title"><h2>我的球袋</h2><span class="small">本次总球数 <b id="total">0</b></span></div><div class="inventory-body"><section class="panel inventory"><div id="balls"></div><div id="result" aria-live="polite"></div><button id="finish" class="primary session-button">结束刷取</button><button id="newSession" class="session-button" hidden>开始新一轮球数记录</button></section><p class="hint inventory-help">填写开始时的球数，中途补球可累加。结束后填写剩余球数，计算实际消耗。</p></div></aside></div><footer>记录仅保存在当前浏览器，请勿清理网站数据。<span>祝下一次，就遇见心动异色 ✦</span></footer></main><div id="toast" role="status" aria-live="polite"></div><dialog id="editor"><form id="editForm"><h2 id="dialogTitle"></h2><p id="dialogText" class="hint"></p><label id="valueLabel">数量<input id="editValue" type="number" min="0" step="1" required></label><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">确认</button></div></form></dialog><dialog id="finishDialog"><form id="finishForm"><h2>结束刷取</h2><p class="hint">实际消耗 = 开始球数 + 中途补球 − 结束剩余球数</p><label>现有条件球<input id="end0" type="number" min="0" step="1" required></label><label>现有赛季球<input id="end1" type="number" min="0" step="1" required></label><p id="finishError" role="alert"></p><div class="dialog-actions"><button type="button" id="cancelFinish">取消</button><button class="primary" type="submit">确认结束</button></div></form></dialog><script src="app.js"></script></body></html>
